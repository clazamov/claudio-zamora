apiVersion: v1
kind: Pod
metadata:
  labels:
    app: agente-claudio-zamora
spec:
  serviceAccountName: jenkins-deployer
  containers:
    - name: node
      image: node:24-alpine
      command: ["sleep"]
      args: ["99d"]
      securityContext:
        runAsUser: 0
    - name: docker
      image: docker:27-cli
      command: ["sleep"]
      args: ["99d"]
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: dind
          image: docker:27-dind
          args:
          - dockerd
          - --host=tcp://127.0.0.1:2375
          - --host=unix:///var/run/docker.sock
          - --tls=false
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      volumeMounts:
        - name: docker-storage
          mountPath: /var/lib/docker
  volumes:
    - name: docker-storage
      emptyDir: {}

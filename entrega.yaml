# API_KEY permanece en secret-claudio-zamora; se crea previamente en el clúster y el pipeline no lo modifica.
apiVersion: v1
kind: Namespace
metadata:
  name: ns-claudio-zamora
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-claudio-zamora
  namespace: ns-claudio-zamora
data:
  AMBIENTE: develop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-claudio-zamora
  namespace: ns-claudio-zamora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claudio-zamora
  template:
    metadata:
      labels:
        app: claudio-zamora
    spec:
      containers:
        - name: claudio-zamora
          image: docker.io/clazamov/claudiozamora:claudio-zamora
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-claudio-zamora
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-claudio-zamora
                  key: API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: svc-claudio-zamora
  namespace: ns-claudio-zamora
spec:
  type: ClusterIP
  selector:
    app: claudio-zamora
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claudio-zamora
  namespace: ns-claudio-zamora
spec:
  ingressClassName: nginx
  rules:
    - host: laboratorio3.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-claudio-zamora
                port:
                  number: 80

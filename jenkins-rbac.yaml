apiVersion: v1
kind: Namespace
metadata:
  name: ns-claudio-zamora
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: ns-claudio-zamora
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["secret-claudio-zamora"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: ns-claudio-zamora
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io

---
# Permitir al agente actual usar el Role existente.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-laboratorio3-agent
  namespace: ns-claudio-zamora
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io
---
# Permisos adicionales para el Secret que actualiza el pipeline.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-laboratorio3-secret
  namespace: ns-claudio-zamora
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["secret-claudio-zamora"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-laboratorio3-secret
  namespace: ns-claudio-zamora
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-laboratorio3-secret
  apiGroup: rbac.authorization.k8s.io
---
# entrega.yaml aplica este namespace: permitir consultar y actualizar sólo éste.
# El Namespace se crea previamente al aplicar este archivo desde WSL.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-laboratorio3-namespace
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["ns-claudio-zamora"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-laboratorio3-namespace
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-laboratorio3-namespace
  apiGroup: rbac.authorization.k8s.io
